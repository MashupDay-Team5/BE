name: CI

# develop 또는 main으로 향하는 PR이 열리거나 커밋이 추가될 때 실행
on:
  pull_request:
    branches: [ develop, main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 테스트는 test 프로필(H2)로 실행됨 → DB 환경변수 불필요
      - name: Build & Test
        run: ./gradlew clean build
