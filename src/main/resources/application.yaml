spring:
  application:
    name: mashup-team5
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update

openai:
  api-key: ${OPENAI_API_KEY}
  model: ${OPENAI_MODEL}
  timeout: ${OPENAI_TIMEOUT}
