spring:
  application:
    name: mashup-team5
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

openai:
  api-key: ${OPENAI_API_KEY}
  model: ${OPENAI_MODEL}
  timeout: ${OPENAI_TIMEOUT}

review-keyword:
  refresh:
    # 리뷰 키워드 자동 갱신 실행 여부 (true: 실행, false : 중지)
    enabled: ${REVIEW_KEYWORD_REFRESH_ENABLED}
